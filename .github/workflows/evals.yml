name: Skill Evals

on:
  push:
    paths:
      - "skills/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/evals.yml"
  pull_request:
    paths:
      - "skills/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/evals.yml"

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --include=optional

      - name: Run skill evals (API backend)
        env:
          EVAL_BACKEND: api
          EVAL_API_MODEL: claude-sonnet-4-5
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm test
